// Spark Video Processor — control plane API (M4).
// The control daemon (control/daemon.cpp) implements this gRPC service and also mirrors it as
// HTTP/JSON (protobuf JSON mapping) for the web dashboard. Messages are defined once here and reused
// by both transports.
syntax = "proto3";

package spark.control;

// Pipeline configuration — maps to the st2110_pipeline env vars (SPARK_*).
message PipelineConfig {
  string profile = 1;     // input resolution: "1080p" | "2160p" (fallback when in_* unset)
  uint32 out_width = 2;   // resize target width  (e.g. 3840)
  uint32 out_height = 3;  // resize target height (e.g. 2160)
  string interp = 4;      // "auto" | "linear" | "cubic" | "lanczos" | "super", or AI x2
                          // super-resolution on luma: "fsrcnn" | "fsrcnn-s" | "espcn"
  bool frc = 5;           // motion-compensated frame interpolation on/off
  string rx_pci = 6;      // CX-7 RX port BDF (one-time media-interface map; see rx_iface_ip)
  string tx_pci = 7;      // CX-7 TX port BDF
  string dst_mac = 8;     // egress destination MAC (auto-derived from tx_mcast_group when multicast)
  uint32 frames = 9;      // 0 = run until stopped; >0 = bounded run

  // --- NMOS / network-layer source + sink (M6). Filled by the NMOS node from a connected sender's
  // IS-05 transport params + SDP, so 2110 sources are discovered/routed instead of typed by hand. ---
  // RX video (ST 2110-20)
  string rx_mcast_group = 10;   // multicast group to join
  string rx_src_ip = 11;        // SSM source filter (sender's source IP)
  uint32 rx_dst_port = 12;      // RTP destination UDP port
  string rx_iface_ip = 13;      // local media interface IP (selects which CX-7 port)
  // RX audio (ST 2110-30)
  string rx_audio_mcast_group = 14;
  string rx_audio_src_ip = 15;
  uint32 rx_audio_dst_port = 16;
  // explicit input video format from the sender SDP (overrides `profile` when in_width != 0)
  uint32 in_width = 17;
  uint32 in_height = 18;
  string in_exactframerate = 19;  // e.g. "60000/1001"
  uint32 in_depth = 20;           // bits per component, e.g. 10
  string in_sampling = 21;        // e.g. "YCbCr-4:2:2"
  // TX video/audio egress (our output senders' groups/ports)
  string tx_mcast_group = 22;
  uint32 tx_dst_port = 23;
  string tx_audio_mcast_group = 24;
  uint32 tx_audio_dst_port = 25;

  // FRC mode: 0=off, 1=retime (1:1 motion-comp), 2=up-convert (2x output rate, e.g. 30->60).
  // Supersedes the legacy `frc` bool (frc=true ⇒ mode 1) whenever frc_mode > 0.
  uint32 frc_mode = 26;

  // Blackmagic IP10 (10:8) output codec. Required for Blackmagic receivers to accept 2160p59.94/60
  // over 10G (uncompressed 4K60 ~12 Gbps won't fit). Off ⇒ uncompressed RFC 4175. Maps to SPARK_IP10;
  // the sender SDP then advertises vnd.blackmagicdesign.ip10 (ST 2110-22). JSON: ip10
  bool ip10 = 27;

  // Input source is Blackmagic IP10 (e.g. a Blackmagic 2160p59.94/60 sender). The RX depacketizes
  // 8-bit codeword pgroups and the unpack stage IP10-decodes them to 10-bit. Maps to SPARK_IN_IP10.
  // Auto-set by the NMOS bridge from the connected sender's SDP (rtpmap/scheme). JSON: inIp10
  bool in_ip10 = 28;

  // TX egress source IP — MUST match the sender SDP's source-filter, or SSM receivers (e.g. Blackmagic)
  // filter our packets out and show black. Set by the NMOS bridge from our sender's resolved source_ip;
  // empty ⇒ engine default. Maps to SPARK_TX_SRC. JSON: txSrc
  string tx_src = 29;

  // TX pacing fill: fraction of the frame interval to spread packets over (0<fill<=1). <1 finishes each
  // frame early so its tail reaches a narrow (2110TPN) receiver before its deadline — fixes bottom-of-
  // frame breakup at high rates. 0 ⇒ engine default (0.9). Maps to SPARK_TX_FILL. JSON: txFill
  double tx_fill = 30;

  // --- modular filter chain (M9). Each stage is inserted only when its parameters are non-neutral;
  // `filters` overrides the set/order explicitly. Scaling (up OR down — downscales use anti-aliased
  // supersampling when interp is "auto") remains out_width/out_height + interp above. ---
  // Luma unsharp-mask sharpening gain. 0 ⇒ stage off. Maps to SPARK_SHARPEN. JSON: sharpen
  double sharpen = 31;
  // Proc amp (classic video corrector, native 10-bit YCbCr). Neutral = (0, 1, 1, 0). For contrast &
  // saturation, 0 ⇒ unset ⇒ neutral 1.0 (proto3 zero-default safety — near-zero values like 0.01 give
  // an effective zero). JSON: paBrightness paContrast paSaturation paHueDeg
  double pa_brightness = 32;  // black-level offset, ±1.0 = ±full Y swing
  double pa_contrast = 33;    // video gain about black; 1 = unity
  double pa_saturation = 34;  // chroma gain; 1 = unity
  double pa_hue_deg = 35;     // chroma phase rotation, degrees
  // Explicit chain order override, comma list of frc|scale|sharpen|procamp (advanced; "" = automatic
  // order frc,scale,sharpen,procamp with per-stage activation). Maps to SPARK_FILTERS. JSON: filters
  string filters = 36;
  // Dashboard filter-panel row order: ALL filters (enabled AND disabled), top to bottom. Pure GUI
  // state — the engine never reads it (`filters` above stays the wire chain); it persists here so
  // disabled rows keep their staged position across page reloads and browsers. The GUI ignores it
  // when its enabled subset disagrees with `filters`. JSON: filterOrder
  string filter_order = 37;

  // Film grain (GrainOp; kernels ported from REDStreamer). amount 0..1, 0 = stage off. Maps to
  // SPARK_GRAIN. JSON: grain
  double grain = 38;
  // Grain cell size in pixels, 1..4. 0 = unset -> 1.5 (proto3 zero-default). SPARK_GRAIN_SIZE.
  // JSON: grainSize
  double grain_size = 39;
  // "mono" (luma-only grain, silver-halide look) | "color" (independent chroma fields). "" ->
  // mono. Maps to SPARK_GRAIN_MODE. JSON: grainMode
  string grain_mode = 40;
  // A/V delay — a schedule-level chain stage ('delay' token in `filters`), not a GPU op: each
  // essence's wire time shifts independently on top of the fixed latency L (video -> capture + L +
  // delay_video_ms, audio -> capture + L + delay_audio_ms). Requires fixed-latency mode; the video
  // delay also grows the RX standing frame store. Map to SPARK_DELAY_VIDEO_MS/SPARK_DELAY_AUDIO_MS.
  // JSON: delayVideoMs delayAudioMs
  double delay_video_ms = 41;
  double delay_audio_ms = 42;
}

enum PipelineState {
  STOPPED = 0;
  RUNNING = 1;
  ERRORED = 2;
}

// Last-known pipeline metrics (parsed from the engine's stat lines).
message PipelineStats {
  uint64 rx_frames = 1;
  uint64 rx_packets = 2;
  uint64 rx_lost = 3;
  uint64 tx_frames = 4;
  uint64 tx_packets = 5;
  uint64 tx_future_err = 6;
  uint64 tx_past_err = 7;
  double ingest_latency_us = 8;
  uint64 frc_interpolated = 9;
  // --- M10: fixed-latency schedule + audio relay health ---
  uint64 tx_reanchors = 10;      // genlock re-anchors (servo mode; 0 in fixed mode by design)
  uint64 tx_skipped = 11;        // frames skipped unsent (late vs the schedule -> receiver repeats)
  uint64 fixed_latency_ms = 12;  // configured capture->wire latency L; 0 = adaptive servo (legacy)
  uint64 tx_margin_us = 13;      // min schedule headroom over the last window (fixed-mode gauge)
  uint64 pipe_latency_us = 14;   // unpack->pack GPU-chain latency, current
  uint64 audio_rx_packets = 15;  // 2110-30 packets received (companion flow)
  uint64 audio_tx_packets = 16;  // 2110-30 packets relayed at capture + L
  uint64 audio_late = 17;        // relayed late or dropped (host stall / L too small)
}

message PipelineStatus {
  PipelineState state = 1;
  int32 pid = 2;
  PipelineConfig config = 3;
  PipelineStats stats = 4;
  string message = 5;   // last info / error
  double uptime_s = 6;
  string ptp_gmid = 7;  // live PTP grandmaster id from pmc (EUI-64, dash form); "" if unknown. JSON: ptpGmid
}

message Empty {}
message SetConfigRequest { PipelineConfig config = 1; }
message Ack {
  bool ok = 1;
  string message = 2;
}

service SparkControl {
  rpc GetStatus(Empty) returns (PipelineStatus);
  rpc SetConfig(SetConfigRequest) returns (Ack);  // only while STOPPED
  rpc Start(Empty) returns (Ack);
  rpc Stop(Empty) returns (Ack);
}
