// Spark Video Processor — control plane API (M4).
// The control daemon (control/daemon.cpp) implements this gRPC service and also mirrors it as
// HTTP/JSON (protobuf JSON mapping) for the web dashboard. Messages are defined once here and reused
// by both transports.
syntax = "proto3";

package spark.control;

// Pipeline configuration — maps to the st2110_pipeline env vars (SPARK_*).
message PipelineConfig {
  string profile = 1;     // input resolution: "1080p" | "2160p" (fallback when in_* unset)
  uint32 out_width = 2;   // resize target width  (e.g. 3840)
  uint32 out_height = 3;  // resize target height (e.g. 2160)
  string interp = 4;      // "linear" | "cubic" | "lanczos"
  bool frc = 5;           // motion-compensated frame interpolation on/off
  string rx_pci = 6;      // CX-7 RX port BDF (one-time media-interface map; see rx_iface_ip)
  string tx_pci = 7;      // CX-7 TX port BDF
  string dst_mac = 8;     // egress destination MAC (auto-derived from tx_mcast_group when multicast)
  uint32 frames = 9;      // 0 = run until stopped; >0 = bounded run

  // --- NMOS / network-layer source + sink (M6). Filled by the NMOS node from a connected sender's
  // IS-05 transport params + SDP, so 2110 sources are discovered/routed instead of typed by hand. ---
  // RX video (ST 2110-20)
  string rx_mcast_group = 10;   // multicast group to join
  string rx_src_ip = 11;        // SSM source filter (sender's source IP)
  uint32 rx_dst_port = 12;      // RTP destination UDP port
  string rx_iface_ip = 13;      // local media interface IP (selects which CX-7 port)
  // RX audio (ST 2110-30)
  string rx_audio_mcast_group = 14;
  string rx_audio_src_ip = 15;
  uint32 rx_audio_dst_port = 16;
  // explicit input video format from the sender SDP (overrides `profile` when in_width != 0)
  uint32 in_width = 17;
  uint32 in_height = 18;
  string in_exactframerate = 19;  // e.g. "60000/1001"
  uint32 in_depth = 20;           // bits per component, e.g. 10
  string in_sampling = 21;        // e.g. "YCbCr-4:2:2"
  // TX video/audio egress (our output senders' groups/ports)
  string tx_mcast_group = 22;
  uint32 tx_dst_port = 23;
  string tx_audio_mcast_group = 24;
  uint32 tx_audio_dst_port = 25;

  // FRC mode: 0=off, 1=retime (1:1 motion-comp), 2=up-convert (2x output rate, e.g. 30->60).
  // Supersedes the legacy `frc` bool (frc=true ⇒ mode 1) whenever frc_mode > 0.
  uint32 frc_mode = 26;

  // Blackmagic IP10 (10:8) output codec. Required for Blackmagic receivers to accept 2160p59.94/60
  // over 10G (uncompressed 4K60 ~12 Gbps won't fit). Off ⇒ uncompressed RFC 4175. Maps to SPARK_IP10;
  // the sender SDP then advertises vnd.blackmagicdesign.ip10 (ST 2110-22). JSON: ip10
  bool ip10 = 27;
}

enum PipelineState {
  STOPPED = 0;
  RUNNING = 1;
  ERRORED = 2;
}

// Last-known pipeline metrics (parsed from the engine's stat lines).
message PipelineStats {
  uint64 rx_frames = 1;
  uint64 rx_packets = 2;
  uint64 rx_lost = 3;
  uint64 tx_frames = 4;
  uint64 tx_packets = 5;
  uint64 tx_future_err = 6;
  uint64 tx_past_err = 7;
  double ingest_latency_us = 8;
  uint64 frc_interpolated = 9;
}

message PipelineStatus {
  PipelineState state = 1;
  int32 pid = 2;
  PipelineConfig config = 3;
  PipelineStats stats = 4;
  string message = 5;   // last info / error
  double uptime_s = 6;
  string ptp_gmid = 7;  // live PTP grandmaster id from pmc (EUI-64, dash form); "" if unknown. JSON: ptpGmid
}

message Empty {}
message SetConfigRequest { PipelineConfig config = 1; }
message Ack {
  bool ok = 1;
  string message = 2;
}

service SparkControl {
  rpc GetStatus(Empty) returns (PipelineStatus);
  rpc SetConfig(SetConfigRequest) returns (Ack);  // only while STOPPED
  rpc Start(Empty) returns (Ack);
  rpc Stop(Empty) returns (Ack);
}
