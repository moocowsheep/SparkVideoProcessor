# Spark Video Processor — ptp4l config for the ConnectX-7, SMPTE ST 2059-2 media-profile starting
# point. Disciplines the shared real-time PHC (ptp0) to a facility grandmaster so the engine's RTP
# timestamps + tx_pp pacing track external reference (ST 2110-10). The engine reads this same PHC via
# rte_eth_read_clock, so disciplining it here aligns the output with no engine change.
#
# IMPORTANT: the message intervals / domain MUST match your facility grandmaster. These are common
# ST 2059-2 values; confirm against your GM. (Loopback on one box doesn't need this — all CX-7 ports
# share ptp0, so "lock" is trivial; this matters for production interop.)
#
# NOTE: ptp4l's parser treats everything after the key as the value — trailing inline comments on a
# directive line are a parse error. Keep all comments on their own lines.
[global]
#
# --- profile / domain ---
# domainNumber: ST 2059-2 default media domain (MUST match your GM)
domainNumber            127
priority1               198
priority2               199
#
# --- IEEE 1588 default profile, end-to-end delay over UDP/IPv4 multicast ---
delay_mechanism         E2E
network_transport       UDPv4
#ignore_source_pos_table 1
#
# --- message intervals (log2 seconds) ---
# CRITICAL: logAnnounceInterval MUST match the upstream master's announce rate. ptp4l derives the
# announce-receipt timeout from the CONFIGURED value (announceReceiptTimeout x 2^logAnnounceInterval),
# NOT from what's on the wire. If it's shorter than the master's actual announce period, the timeout
# fires before each announce arrives -> constant SLAVE<->LISTENING flapping (never holds lock).
# Observed 2026-06-16: our facility boundary clock (the managed switch, 192.168.18.158, relaying GM
# 3484e4.fffe.aad988 @ 192.168.18.125) announces at logInterval 0 = 1/s, so we match it here.
# announceReceiptTimeout 3 x 1s = 3s tolerance. (ST 2059-2 media profile is -2 = 4/s; if the switch is
# reconfigured to the media profile, set this back to -2.)
logAnnounceInterval     0
logSyncInterval         -3
logMinDelayReqInterval  -3
announceReceiptTimeout  3
#
# --- hardware timestamping on the CX-7 PHC (M0 gate 1) ---
time_stamping           hardware
tx_timestamp_timeout    50
#
# --- servo ---
clock_servo             pi
#
# --- logging ---
logging_level           6
# summary_interval 0 = one servo summary per second (offset/freq) for monitoring
summary_interval        0

#ptpTimescale 1
